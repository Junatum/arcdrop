name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  contracts:
    name: ArcDrop ShellSpec contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify all tests are included in CI
        run: sh tests/test-suite-integrity.sh

      - name: Verify OpenWrt 25.12 BusyBox compatibility
        run: sh tests/test-openwrt-commands.sh

      - name: Install host CGI build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjson-c-dev pkg-config gcc

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install ShellSpec
        env:
          SHELLSPEC_VERSION: 0.28.1
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/lib"
          git clone --depth 1 --branch "$SHELLSPEC_VERSION" \
            https://github.com/shellspec/shellspec.git "$HOME/.local/lib/shellspec"
          ln -s "$HOME/.local/lib/shellspec/shellspec" "$HOME/.local/bin/shellspec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellspec" --version

      - name: Run ShellSpec contracts
        run: shellspec

  lint:
    name: ArcDrop language lint (C, JS, CSS, HTML, Python, Shell, YAML, SVG)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install native lint dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang clang-tidy libjson-c-dev pkg-config shellcheck

      - name: Install pinned host lint tools
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python3 -m pip install 'ruff==0.14.5' 'yamllint==1.37.1'

      - name: Run all language linters
        run: sh tools/lint.sh
